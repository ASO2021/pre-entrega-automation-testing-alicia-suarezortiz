[pytest]
pythonpath = .
testpaths = tests
addopts = -v --reruns 1 --reruns-delay 1 --html=reports/report.html --self-contained-html
markers =
    smoke: tests criticos del flujo principal
log_file = reports/execution.log
log_file_level = INFO
log_file_format = %(asctime)s | %(levelname)s | %(message)s
